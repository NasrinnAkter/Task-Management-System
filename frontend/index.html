<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Task Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;
const API = "http://localhost:5000/api";

// ── Helpers ──────────────────────────────────────────────
function authHeaders(token) {
  return { "Content-Type": "application/json", Authorization: `Bearer ${token}` };
}

function StatusBadge({ value }) {
  const styles = {
    pending:       "bg-yellow-100 text-yellow-800",
    "in-progress": "bg-blue-100 text-blue-800",
    completed:     "bg-green-100 text-green-800",
  };
  return (
    <span className={`px-2 py-0.5 rounded-full text-xs font-semibold ${styles[value] || "bg-gray-100 text-gray-600"}`}>
      {value}
    </span>
  );
}

function PriorityBadge({ value }) {
  const styles = {
    high:   "bg-red-100 text-red-700",
    medium: "bg-orange-100 text-orange-700",
    low:    "bg-green-100 text-green-700",
  };
  return (
    <span className={`px-2 py-0.5 rounded-full text-xs font-semibold ${styles[value] || "bg-gray-100 text-gray-600"}`}>
      {value}
    </span>
  );
}

function Message({ msg }) {
  if (!msg.text) return null;
  const base = "px-4 py-2 rounded-md text-sm mb-3";
  const color = msg.type === "error"
    ? "bg-red-50 text-red-700 border border-red-200"
    : "bg-green-50 text-green-700 border border-green-200";
  return <div className={`${base} ${color}`}>{msg.text}</div>;
}

// ── Login Page ────────────────────────────────────────────
function LoginPage({ onLogin }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [msg, setMsg] = useState({});

  const fillCreds = (e, p) => { setEmail(e); setPassword(p); };

  const doLogin = async () => {
    if (!email || !password) return setMsg({ type: "error", text: "Email and password are required." });
    try {
      const res = await fetch(`${API}/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();
      if (!res.ok) return setMsg({ type: "error", text: data.message });
      onLogin(data.token, data.user);
    } catch {
      setMsg({ type: "error", text: "Cannot connect to server. Is the backend running?" });
    }
  };

  return (
    <div className="fixed inset-0 flex items-center justify-center bg-white z-50 p-4">
      <div className="flex w-full max-w-3xl rounded-2xl overflow-hidden shadow-2xl">

        {/* Left Panel */}
        <div className="hidden md:flex flex-col gap-8 flex-1 bg-gradient-to-br from-slate-800 to-emerald-900 p-10 text-white">
          <div className="flex items-center gap-3">
            <div className="w-10 h-10 bg-white/10 rounded-xl flex items-center justify-center text-xl">📋</div>
            <span className="font-bold text-lg">TaskManager</span>
          </div>
          <div>
            <p className="text-2xl font-bold leading-snug mb-6">
              Organize work,<br />deliver <span className="text-emerald-400">results.</span>
            </p>
            <ul className="space-y-3 text-sm opacity-90">
              {["Role-based access for Admin & Users", "Create, assign and track tasks",
                "Secure JWT authentication", "Real-time status updates"].map(f => (
                <li key={f} className="flex items-center gap-2">
                  <span className="w-5 h-5 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xs font-bold">✓</span>
                  {f}
                </li>
              ))}
            </ul>
          </div>
        </div>

        {/* Right Panel */}
        <div className="flex-1 bg-white p-10 flex flex-col justify-center">
          <h2 className="text-2xl font-bold text-gray-900 mb-1">Welcome back</h2>
          <p className="text-sm text-gray-500 mb-6">Sign in to your account to continue</p>

          <Message msg={msg} />

          <label className="block text-xs font-bold text-gray-600 uppercase tracking-wide mb-1">Email address</label>
          <input
            type="email"
            value={email}
            onChange={e => setEmail(e.target.value)}
            placeholder="you@example.com"
            className="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm mb-4 focus:outline-none focus:border-slate-500 focus:ring-2 focus:ring-slate-100"
          />

          <label className="block text-xs font-bold text-gray-600 uppercase tracking-wide mb-1">Password</label>
          <input
            type="password"
            value={password}
            onChange={e => setPassword(e.target.value)}
            placeholder="Enter your password"
            onKeyDown={e => e.key === "Enter" && doLogin()}
            className="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm mb-5 focus:outline-none focus:border-slate-500 focus:ring-2 focus:ring-slate-100"
          />

          <button
            onClick={doLogin}
            className="w-full bg-gradient-to-r from-slate-700 to-slate-900 text-white font-bold py-3 rounded-lg hover:opacity-90 transition text-sm"
          >
            Sign in →
          </button>

          {/* Demo Credentials */}
          <div className="mt-5 p-4 bg-gray-50 border border-gray-200 rounded-lg">
            <p className="text-xs font-bold text-gray-400 uppercase tracking-wide mb-3">Demo credentials</p>
            {[
              { label: "Admin", badge: "bg-red-100 text-red-700", email: "admin@example.com", pass: "admin123" },
              { label: "User",  badge: "bg-blue-100 text-blue-700", email: "nasrin@example.com", pass: "user123" },
            ].map(c => (
              <div key={c.label} className="flex items-center gap-2 mb-2 flex-wrap">
                <span className={`text-xs font-bold px-2 py-0.5 rounded-full ${c.badge}`}>{c.label}</span>
                <span className="text-xs text-gray-500 font-mono flex-1">{c.email} / {c.pass}</span>
                <button
                  onClick={() => fillCreds(c.email, c.pass)}
                  className="text-xs border border-gray-300 rounded px-2 py-0.5 text-gray-500 hover:bg-gray-100"
                >Fill</button>
              </div>
            ))}
          </div>
        </div>

      </div>
    </div>
  );
}

// ── Edit Modal ────────────────────────────────────────────
function EditModal({ task, token, onClose, onSaved }) {
  const [title, setTitle]       = useState(task.title);
  const [desc, setDesc]         = useState(task.description || "");
  const [status, setStatus]     = useState(task.status);
  const [priority, setPriority] = useState(task.priority);

  const save = async () => {
    const res = await fetch(`${API}/tasks/${task.id}`, {
      method: "PUT",
      headers: authHeaders(token),
      body: JSON.stringify({ title, description: desc, status, priority }),
    });
    if (!res.ok) { const d = await res.json(); return alert(d.message); }
    onSaved();
    onClose();
  };

  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
      <div className="bg-white rounded-xl p-6 w-full max-w-md shadow-xl">
        <h3 className="text-base font-bold text-slate-800 mb-4">✏️ Edit Task</h3>
        <input value={title} onChange={e => setTitle(e.target.value)}
          className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm mb-3 focus:outline-none focus:border-slate-500"
          placeholder="Title" />
        <textarea value={desc} onChange={e => setDesc(e.target.value)}
          className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm mb-3 h-20 resize-y focus:outline-none focus:border-slate-500"
          placeholder="Description" />
        <select value={status} onChange={e => setStatus(e.target.value)}
          className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm mb-3 focus:outline-none">
          <option value="pending">Pending</option>
          <option value="in-progress">In Progress</option>
          <option value="completed">Completed</option>
        </select>
        <select value={priority} onChange={e => setPriority(e.target.value)}
          className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm mb-4 focus:outline-none">
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
        <div className="flex gap-3">
          <button onClick={save}
            className="flex-1 bg-slate-800 text-white text-sm font-semibold py-2 rounded-lg hover:bg-slate-700 transition">
            Save
          </button>
          <button onClick={onClose}
            className="flex-1 bg-gray-100 text-gray-600 text-sm font-semibold py-2 rounded-lg hover:bg-gray-200 transition">
            Cancel
          </button>
        </div>
      </div>
    </div>
  );
}

// ── User Dashboard ────────────────────────────────────────
function UserDashboard({ token, user }) {
  const [tasks, setTasks]       = useState([]);
  const [title, setTitle]       = useState("");
  const [desc, setDesc]         = useState("");
  const [priority, setPriority] = useState("medium");
  const [msg, setMsg]           = useState({});
  const [editTask, setEditTask] = useState(null);

  const load = async () => {
    const res = await fetch(`${API}/tasks`, { headers: authHeaders(token) });
    setTasks(await res.json());
  };

  useEffect(() => { load(); }, []);

  const showMsg = (text, type = "error") => {
    setMsg({ text, type });
    setTimeout(() => setMsg({}), 4000);
  };

  const createTask = async () => {
    if (!title.trim()) return showMsg("Title is required.");
    const res = await fetch(`${API}/tasks`, {
      method: "POST",
      headers: authHeaders(token),
      body: JSON.stringify({ title, description: desc, priority }),
    });
    const data = await res.json();
    if (!res.ok) return showMsg(data.message);
    showMsg("Task created!", "success");
    setTitle(""); setDesc("");
    load();
  };

  const deleteTask = async (id) => {
    if (!confirm("Delete this task?")) return;
    const res = await fetch(`${API}/tasks/${id}`, { method: "DELETE", headers: authHeaders(token) });
    const data = await res.json();
    if (!res.ok) return alert(data.message);
    load();
  };

  return (
    <div className="space-y-5">
      <div className="bg-blue-50 border-l-4 border-blue-700 px-4 py-3 rounded-lg text-sm text-blue-800">
        Welcome, <strong>{user.name}</strong>! You can only see and manage your own tasks.
      </div>

      {/* Create Task */}
      <div className="bg-white rounded-xl shadow-sm p-5">
        <h2 className="text-base font-bold text-slate-800 mb-4">➕ Create New Task</h2>
        <Message msg={msg} />
        <input value={title} onChange={e => setTitle(e.target.value)}
          placeholder="Task title *"
          className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm mb-3 focus:outline-none focus:border-slate-500" />
        <textarea value={desc} onChange={e => setDesc(e.target.value)}
          placeholder="Description (optional)"
          className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm mb-3 h-16 resize-y focus:outline-none focus:border-slate-500" />
        <select value={priority} onChange={e => setPriority(e.target.value)}
          className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm mb-4 focus:outline-none">
          <option value="low">Low Priority</option>
          <option value="medium">Medium Priority</option>
          <option value="high">High Priority</option>
        </select>
        <button onClick={createTask}
          className="bg-slate-800 text-white text-sm font-semibold px-5 py-2 rounded-lg hover:bg-slate-700 transition">
          Create Task
        </button>
      </div>

      {/* Task Table */}
      <div className="bg-white rounded-xl shadow-sm p-5">
        <h2 className="text-base font-bold text-slate-800 mb-4">📌 My Tasks</h2>
        <div className="overflow-x-auto">
          <table className="w-full text-sm min-w-[420px]">
            <thead>
              <tr className="bg-slate-800 text-white text-left">
                <th className="px-4 py-2.5 rounded-tl-lg">Title</th>
                <th className="px-4 py-2.5">Priority</th>
                <th className="px-4 py-2.5">Status</th>
                <th className="px-4 py-2.5 rounded-tr-lg">Actions</th>
              </tr>
            </thead>
            <tbody>
              {tasks.length === 0
                ? <tr><td colSpan={4} className="text-center py-6 text-gray-400">No tasks yet.</td></tr>
                : tasks.map(t => (
                  <tr key={t.id} className="border-b border-gray-100 hover:bg-gray-50">
                    <td className="px-4 py-3">
                      <div className="font-medium text-gray-800">{t.title}</div>
                      {t.description && <div className="text-xs text-gray-400 mt-0.5">{t.description}</div>}
                    </td>
                    <td className="px-4 py-3"><PriorityBadge value={t.priority} /></td>
                    <td className="px-4 py-3"><StatusBadge value={t.status} /></td>
                    <td className="px-4 py-3">
                      <div className="flex gap-2">
                        <button onClick={() => setEditTask(t)}
                          className="bg-slate-700 text-white text-xs px-3 py-1 rounded-md hover:bg-slate-600 transition">Edit</button>
                        <button onClick={() => deleteTask(t.id)}
                          className="bg-red-500 text-white text-xs px-3 py-1 rounded-md hover:bg-red-400 transition">Delete</button>
                      </div>
                    </td>
                  </tr>
                ))
              }
            </tbody>
          </table>
        </div>
      </div>

      {editTask && <EditModal task={editTask} token={token} onClose={() => setEditTask(null)} onSaved={load} />}
    </div>
  );
}

// ── Admin Dashboard ───────────────────────────────────────
function AdminDashboard({ token }) {
  const [tab, setTab]     = useState("tasks");
  const [tasks, setTasks] = useState([]);
  const [users, setUsers] = useState([]);
  const [editTask, setEditTask] = useState(null);

  const [title, setTitle]       = useState("");
  const [desc, setDesc]         = useState("");
  const [priority, setPriority] = useState("medium");
  const [assignTo, setAssignTo] = useState("");
  const [msg, setMsg]           = useState({});

  const loadTasks = async () => {
    const res = await fetch(`${API}/tasks`, { headers: authHeaders(token) });
    setTasks(await res.json());
  };

  const loadUsers = async () => {
    const res = await fetch(`${API}/users`, { headers: authHeaders(token) });
    setUsers(await res.json());
  };

  useEffect(() => { loadTasks(); loadUsers(); }, []);

  const showMsg = (text, type = "error") => {
    setMsg({ text, type });
    setTimeout(() => setMsg({}), 4000);
  };

  const createTask = async () => {
    if (!title.trim()) return showMsg("Title is required.");
    const res = await fetch(`${API}/tasks`, {
      method: "POST",
      headers: authHeaders(token),
      body: JSON.stringify({ title, description: desc, priority, userId: assignTo || undefined }),
    });
    const data = await res.json();
    if (!res.ok) return showMsg(data.message);
    showMsg("Task created!", "success");
    setTitle(""); setDesc(""); setAssignTo("");
    loadTasks();
  };

  const deleteTask = async (id) => {
    if (!confirm("Delete this task?")) return;
    const res = await fetch(`${API}/tasks/${id}`, { method: "DELETE", headers: authHeaders(token) });
    const data = await res.json();
    if (!res.ok) return alert(data.message);
    loadTasks();
  };

  const deleteUser = async (id) => {
    if (!confirm("Delete this user?")) return;
    const res = await fetch(`${API}/users/${id}`, { method: "DELETE", headers: authHeaders(token) });
    const data = await res.json();
    if (!res.ok) return alert(data.message);
    loadUsers(); loadTasks();
  };

  const tabs = [
    { key: "tasks",  label: "All Tasks" },
    { key: "users",  label: "All Users" },
    { key: "create", label: "Create Task" },
  ];

  return (
    <div className="space-y-5">
      <div className="bg-blue-50 border-l-4 border-blue-700 px-4 py-3 rounded-lg text-sm text-blue-800">
        Logged in as <strong>Admin</strong>. You can manage all users and tasks.
      </div>

      {/* Tabs */}
      <div className="flex gap-2 flex-wrap">
        {tabs.map(t => (
          <button key={t.key} onClick={() => setTab(t.key)}
            className={`px-4 py-2 rounded-lg text-sm font-semibold border-2 border-slate-800 transition
              ${tab === t.key ? "bg-slate-800 text-white" : "bg-white text-slate-800 hover:bg-slate-50"}`}>
            {t.label}
          </button>
        ))}
      </div>

      {/* All Tasks Tab */}
      {tab === "tasks" && (
        <div className="bg-white rounded-xl shadow-sm p-5">
          <h2 className="text-base font-bold text-slate-800 mb-4">📋 All Tasks</h2>
          <div className="overflow-x-auto">
            <table className="w-full text-sm min-w-[500px]">
              <thead>
                <tr className="bg-slate-800 text-white text-left">
                  <th className="px-4 py-2.5 rounded-tl-lg">Title</th>
                  <th className="px-4 py-2.5">Assigned To</th>
                  <th className="px-4 py-2.5">Priority</th>
                  <th className="px-4 py-2.5">Status</th>
                  <th className="px-4 py-2.5 rounded-tr-lg">Actions</th>
                </tr>
              </thead>
              <tbody>
                {tasks.map(t => (
                  <tr key={t.id} className="border-b border-gray-100 hover:bg-gray-50">
                    <td className="px-4 py-3 font-medium text-gray-800">{t.title}</td>
                    <td className="px-4 py-3 text-gray-500">{t.ownerName || "-"}</td>
                    <td className="px-4 py-3"><PriorityBadge value={t.priority} /></td>
                    <td className="px-4 py-3"><StatusBadge value={t.status} /></td>
                    <td className="px-4 py-3">
                      <div className="flex gap-2">
                        <button onClick={() => setEditTask(t)}
                          className="bg-slate-700 text-white text-xs px-3 py-1 rounded-md hover:bg-slate-600 transition">Edit</button>
                        <button onClick={() => deleteTask(t.id)}
                          className="bg-red-500 text-white text-xs px-3 py-1 rounded-md hover:bg-red-400 transition">Delete</button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {/* All Users Tab */}
      {tab === "users" && (
        <div className="bg-white rounded-xl shadow-sm p-5">
          <h2 className="text-base font-bold text-slate-800 mb-4">👥 All Users</h2>
          <div className="overflow-x-auto">
            <table className="w-full text-sm min-w-[400px]">
              <thead>
                <tr className="bg-slate-800 text-white text-left">
                  <th className="px-4 py-2.5 rounded-tl-lg">Name</th>
                  <th className="px-4 py-2.5">Email</th>
                  <th className="px-4 py-2.5">Role</th>
                  <th className="px-4 py-2.5 rounded-tr-lg">Actions</th>
                </tr>
              </thead>
              <tbody>
                {users.map(u => (
                  <tr key={u.id} className="border-b border-gray-100 hover:bg-gray-50">
                    <td className="px-4 py-3 font-medium text-gray-800">{u.name}</td>
                    <td className="px-4 py-3 text-gray-500">{u.email}</td>
                    <td className="px-4 py-3">
                      <span className={`px-2 py-0.5 rounded-full text-xs font-semibold
                        ${u.role === "admin" ? "bg-red-100 text-red-700" : "bg-blue-100 text-blue-700"}`}>
                        {u.role}
                      </span>
                    </td>
                    <td className="px-4 py-3">
                      {u.role !== "admin"
                        ? <button onClick={() => deleteUser(u.id)}
                            className="bg-red-500 text-white text-xs px-3 py-1 rounded-md hover:bg-red-400 transition">Delete</button>
                        : <span className="text-xs text-gray-400">Protected</span>
                      }
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {/* Create Task Tab */}
      {tab === "create" && (
        <div className="bg-white rounded-xl shadow-sm p-5">
          <h2 className="text-base font-bold text-slate-800 mb-4">➕ Create Task (Assign to User)</h2>
          <Message msg={msg} />
          <input value={title} onChange={e => setTitle(e.target.value)}
            placeholder="Task title *"
            className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm mb-3 focus:outline-none focus:border-slate-500" />
          <textarea value={desc} onChange={e => setDesc(e.target.value)}
            placeholder="Description (optional)"
            className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm mb-3 h-16 resize-y focus:outline-none focus:border-slate-500" />
          <select value={priority} onChange={e => setPriority(e.target.value)}
            className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm mb-3 focus:outline-none">
            <option value="low">Low Priority</option>
            <option value="medium">Medium Priority</option>
            <option value="high">High Priority</option>
          </select>
          <select value={assignTo} onChange={e => setAssignTo(e.target.value)}
            className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm mb-4 focus:outline-none">
            <option value="">-- Assign to User --</option>
            {users.filter(u => u.role === "user").map(u => (
              <option key={u.id} value={u.id}>{u.name}</option>
            ))}
          </select>
          <button onClick={createTask}
            className="bg-slate-800 text-white text-sm font-semibold px-5 py-2 rounded-lg hover:bg-slate-700 transition">
            Create Task
          </button>
        </div>
      )}

      {editTask && <EditModal task={editTask} token={token} onClose={() => setEditTask(null)} onSaved={loadTasks} />}
    </div>
  );
}

// ── App Root ──────────────────────────────────────────────
function App() {
  const [token, setToken]       = useState(null);
  const [currentUser, setUser]  = useState(null);

  const handleLogin = (t, u) => { setToken(t); setUser(u); };

  const logout = () => { setToken(null); setUser(null); };

  if (!token) return <LoginPage onLogin={handleLogin} />;

  return (
    <div className="min-h-screen bg-gray-100">
      {/* Header */}
      <header className="bg-slate-800 text-white px-5 py-3 flex justify-between items-center flex-wrap gap-2">
        <h1 className="font-bold text-base">📋 Task Manager</h1>
        <div className="flex items-center gap-4">
          <span className="text-sm opacity-80">👤 {currentUser.name} ({currentUser.role})</span>
          <button onClick={logout}
            className="bg-red-500 hover:bg-red-400 text-white text-xs font-semibold px-4 py-1.5 rounded-md transition">
            Logout
          </button>
        </div>
      </header>

      {/* Content */}
      <div className="max-w-4xl mx-auto px-4 py-5">
        {currentUser.role === "admin"
          ? <AdminDashboard token={token} />
          : <UserDashboard token={token} user={currentUser} />
        }
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
